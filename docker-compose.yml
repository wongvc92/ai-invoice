services:
  db:
    image: postgres:16-alpine
    platform: linux/arm64
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_pass_123}
      POSTGRES_DB: ${POSTGRES_DB:-aiinvoice}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-aiuser} -d ${POSTGRES_DB:-aiinvoice}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./api/.env
    ports:
      - "9000:9000"
    volumes:
      - ./api/app:/app/app
    restart: unless-stopped

  # frontend:
